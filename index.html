<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>بذور — جدول اللقاءات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light;--bg:#fff;--ink:#2b1745;--mute:#6f5f86;--pur:#682e8f;--panel:#f6f1fb;--line:#e1d5ef;--org:#f7931e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,"Segoe UI",sans-serif;line-height:1.7}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.logo{display:block;margin:0 auto 4px;width:min(260px,70%);height:auto}
h1{font-size:1.7rem;text-align:center;margin:0 0 4px;color:var(--pur)}
.sub{color:var(--mute);margin:0 0 20px;text-align:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:6px}
select,input{width:100%;padding:12px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px}
:is(select,input,a,button):focus-visible{outline:3px solid var(--org);outline-offset:2px}
.now{margin-top:10px;color:var(--mute);font-size:.95rem}
.lesson{background:var(--pur);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.lesson h2{font-size:1.2rem;margin:0 0 10px}
.when{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:2rem;font-weight:700;color:var(--org);line-height:1.2}
.day{font-weight:700;font-size:1.1rem}
.mecca{opacity:.85;font-size:.9rem;margin:6px 0 14px}
.warn{background:rgba(255,255,255,.18);border-radius:8px;padding:2px 8px;font-size:.85rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;text-decoration:none;font:inherit;font-weight:700;border:1px solid #fff;color:#fff;background:transparent;cursor:pointer;font-size:.95rem}
.btn.main{background:var(--pur);color:#fff;border-color:var(--pur)}
.btn.del{border-color:rgba(255,255,255,.5);opacity:.9}
.past{opacity:.55}
.mine{font-size:.8rem;color:var(--mute);margin:10px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.err{color:#b42318;margin:8px 0 0;min-height:1.4em}
.empty{color:var(--mute);text-align:center;padding:24px}
h2.f{font-size:1.1rem;margin:0 0 12px;color:var(--pur)}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>

<h1>جدول اللقاءات</h1>
<p class="sub">اللقاءات أسبوعية، وأوقاتها بتوقيت مكة المكرمة. اختر مدينتك لتظهر لك بتوقيتك.</p>
<section class="box">
<label for="city">مدينتك</label>
<select id="city"></select>
<div class="now" id="now"></div>
</section>
<div id="list"></div>
<section class="box">
<h2 class="f">أضف لقاءً</h2>
<div class="grid">
<div class="full"><label for="fn">اسم اللقاء</label><input id="fn" type="text" maxlength="80"></div>
<div><label for="fk">نوع اللقاء</label><select id="fk"><option value="w">متكرر كل أسبوع</option><option value="d">بتاريخ محدد</option></select></div>
<div id="wrapw"><label for="fw">اليوم (بتوقيت مكة)</label>
<select id="fw"><option value="6">السبت</option><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3" selected>الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option></select></div>
<div id="wrapd" hidden><label for="fd">التاريخ (بتوقيت مكة)</label><input id="fd" type="date"></div>
<div><label for="ft">الساعة (بتوقيت مكة)</label><input id="ft" type="time"></div>
<div><label for="fm">المدة</label>
<select id="fm"><option value="30">30 دقيقة</option><option value="45">45 دقيقة</option><option value="60" selected>ساعة</option><option value="90">ساعة ونصف</option><option value="120">ساعتان</option></select></div>
</div>
<p class="err" id="err" role="alert"></p>
<button type="button" class="btn main" id="add">أضف اللقاء</button>
<p class="mine">اللقاءات التي تضيفها تُحفظ على هذا الجهاز فقط.</p>
</section>
</main>
<script>
var KEY="weekly-purple";
var DAYS={0:"أحد",1:"اثنين",2:"ثلاثاء",3:"أربعاء",4:"خميس",5:"جمعة",6:"سبت"};
var LESSONS=[{title:"لبنات العقيدة",dow:3,time:"16:00",mins:60}];
var CITIES=[["مكة المكرمة","Asia/Riyadh"],["الرياض","Asia/Riyadh"],["القاهرة","Africa/Cairo"],["دبي","Asia/Dubai"],["الكويت","Asia/Kuwait"],["الدوحة","Asia/Qatar"],["بغداد","Asia/Baghdad"],["عمّان","Asia/Amman"],["بيروت","Asia/Beirut"],["دمشق","Asia/Damascus"],["القدس","Asia/Jerusalem"],["الخرطوم","Africa/Khartoum"],["طرابلس","Africa/Tripoli"],["تونس","Africa/Tunis"],["الجزائر","Africa/Algiers"],["الدار البيضاء / الرباط","Africa/Casablanca"],["إسطنبول","Europe/Istanbul"],["لندن","Europe/London"],["باريس","Europe/Paris"],["برلين","Europe/Berlin"],["مدريد","Europe/Madrid"],["روما","Europe/Rome"],["موسكو","Europe/Moscow"],["نيويورك","America/New_York"],["شيكاغو","America/Chicago"],["لوس أنجلوس","America/Los_Angeles"],["تورنتو","America/Toronto"],["ساو باولو","America/Sao_Paulo"],["لاغوس","Africa/Lagos"],["نيروبي","Africa/Nairobi"],["جوهانسبرغ","Africa/Johannesburg"],["كراتشي","Asia/Karachi"],["دلهي","Asia/Kolkata"],["دكا","Asia/Dhaka"],["جاكرتا","Asia/Jakarta"],["كوالالمبور","Asia/Kuala_Lumpur"],["سنغافورة","Asia/Singapore"],["طوكيو","Asia/Tokyo"],["سيدني","Australia/Sydney"],["أوكلاند","Pacific/Auckland"]];
var sel=document.getElementById("city"),list=document.getElementById("list"),nowEl=document.getElementById("now"),errEl=document.getElementById("err");
var extra=[];
try{extra=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(extra))extra=[];}catch(e){extra=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(extra));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(ms,tz,o){return new Intl.DateTimeFormat("ar-EG-u-nu-latn",Object.assign({timeZone:tz},o)).format(new Date(ms));}
// أقرب موعد قادم (أو جارٍ) للقاء الأسبوعي؛ مكة = UTC+3 بلا توقيت صيفي
function nextStart(l,t){
var m=new Date(t+3*3600000),tm=l.time.split(":"),delta=(l.dow-m.getUTCDay()+7)%7;
var s=Date.UTC(m.getUTCFullYear(),m.getUTCMonth(),m.getUTCDate()+delta,+tm[0]-3,+tm[1]);
if(s+l.mins*60000<t)s+=7*86400000;
return s;}
function gcal(l,s){var p=function(ms){return new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");};
return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(l.title)+"&dates="+p(s)+"/"+p(s+l.mins*60000)+(l.date?"":"&recur="+encodeURIComponent("RRULE:FREQ=WEEKLY"));}
var detected="";try{detected=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){}
function tzNow(){return sel.value==="__auto"?(detected||"Asia/Riyadh"):sel.value;}
function dn(s,tz){return fmt(s,tz,{weekday:"long"}).replace(/^ال/,"");}
function startOf(l,t){
if(l.date){var d=l.date.split("-"),tm=l.time.split(":");return Date.UTC(+d[0],+d[1]-1,+d[2],+tm[0]-3,+tm[1]);}
return nextStart(l,t);}
function render(){
var tz=tzNow(),t=Date.now(),out="";
nowEl.textContent="الآن عندك: "+fmt(t,tz,{weekday:"long",hour:"numeric",minute:"2-digit"});
var all=LESSONS.map(function(l){return{l:l,mine:-1};}).concat(extra.map(function(l,i){return{l:l,mine:i};}));
all.forEach(function(x){x.s=startOf(x.l,t);x.past=!!x.l.date&&x.s+x.l.mins*60000<t;});
all.sort(function(a,b){return (a.past?1e15:0)+a.s-((b.past?1e15:0)+b.s);});
all.forEach(function(x){
var l=x.l,s=x.s,dated=!!l.date;
var diff=fmt(s,tz,{weekday:"long"})!==fmt(s,"Asia/Riyadh",{weekday:"long"});
var dayTxt=dated?fmt(s,tz,{weekday:"long",day:"numeric",month:"long"}):"كل "+dn(s,tz);
var meccaDay=dated?fmt(s,"Asia/Riyadh",{weekday:"long",day:"numeric",month:"long"}):"كل "+dn(s,"Asia/Riyadh");
out+='<article class="lesson'+(x.past?' past':'')+'"><h2>'+esc(l.title)+' <span class="warn" style="font-size:.8rem;font-weight:500;margin-inline-start:6px">'+(dated?'لقاء بتاريخ محدد':'لقاء متكرر')+'</span></h2>'+
'<div class="when"><span class="day">'+dayTxt+'</span><span class="big">'+fmt(s,tz,{hour:"numeric",minute:"2-digit"})+'</span>'+
(diff?'<span class="warn">يختلف اليوم عن يوم مكة</span>':'')+'</div>'+
'<div class="mecca">بتوقيت مكة: '+meccaDay+' '+fmt(s,"Asia/Riyadh",{hour:"numeric",minute:"2-digit"})+' — المدة '+l.mins+' دقيقة</div>'+
'<div class="acts">'+(x.past?'<span>انتهى هذا اللقاء</span>':'<a class="btn" href="'+gcal(l,s)+'" target="_blank" rel="noopener">'+(dated?'أضِف إلى تقويم جوجل':'أضِف إلى تقويم جوجل (أسبوعيًا)')+'</a>')+
(x.mine>=0?'<button type="button" class="btn del" data-i="'+x.mine+'">حذف</button>':'')+'</div></article>';
});
list.innerHTML=out;
}
var h='<option value="__auto">توقيت جهازي'+(detected?' ('+esc(detected.replace(/_/g," "))+')':'')+'</option><optgroup label="مدن شائعة">';
CITIES.forEach(function(c){h+='<option value="'+c[1]+'">'+c[0]+'</option>';});
h+='</optgroup>';
try{h+='<optgroup label="مدن أخرى (بالإنجليزية)">';Intl.supportedValuesOf("timeZone").forEach(function(z){h+='<option value="'+z+'">'+z.replace(/_/g," ")+'</option>';});h+='</optgroup>';}catch(e){}
sel.innerHTML=h;
sel.addEventListener("change",render);
list.addEventListener("click",function(e){var b=e.target.closest("button[data-i]");if(!b)return;extra.splice(+b.dataset.i,1);save();render();});
var fk=document.getElementById("fk");
fk.addEventListener("change",function(){var d=fk.value==="d";document.getElementById("wrapw").hidden=d;document.getElementById("wrapd").hidden=!d;});
document.getElementById("add").addEventListener("click",function(){
var n=document.getElementById("fn").value.trim(),t=document.getElementById("ft").value,dated=fk.value==="d",d=document.getElementById("fd").value;
if(!n||!t||(dated&&!d)){errEl.textContent=dated?"اكتب اسم اللقاء واختر التاريخ والساعة بتوقيت مكة.":"اكتب اسم اللقاء واختر الساعة بتوقيت مكة.";return;}
errEl.textContent="";
var it={title:n,time:t,mins:+document.getElementById("fm").value};
if(dated)it.date=d;else it.dow=+document.getElementById("fw").value;
extra.push(it);save();
document.getElementById("fn").value="";render();
});
render();
setInterval(render,60000);
</script>
</body>
</html>
